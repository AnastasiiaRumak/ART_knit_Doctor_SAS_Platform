<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — ArtKnit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #EFF6FF, #F9FAFB);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px; color: #111827;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 32px;
    max-width: 420px; width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,.06);
    border: 1px solid #E5E7EB;
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { color: #6B7280; font-size: 13px; margin-bottom: 24px; }
  label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 14px; font-size: 14px;
    border: 1px solid #E5E7EB; border-radius: 8px; outline: none;
  }
  input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  button {
    width: 100%; padding: 12px; margin-top: 16px;
    background: #2563EB; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button:hover { background: #1D4ED8; }
  .alert {
    padding: 10px 14px; border-radius: 8px; font-size: 13px;
    margin-bottom: 16px; display: none;
  }
  .alert.error { display: block; background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
  .hint {
    margin-top: 20px; padding: 12px; background: #FFFBEB;
    border: 1px solid #FDE68A; border-radius: 8px;
    font-size: 12px; color: #78350F; line-height: 1.7;
  }
  code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <h1>Вход в систему</h1>
  <p class="sub">ArtKnit · СМ-Клиника</p>

  <div id="alert" class="alert"></div>

  <form onsubmit="return login(event)">
    <label for="key">API-ключ</label>
    <input type="password" id="key" placeholder="doctor_key_abc123" required>
    <button type="submit">Войти</button>
  </form>

  <div class="hint">
    <strong>Демо-ключи:</strong><br>
    👨‍⚕️ <code>doctor_key_abc123</code><br>
    📊 <code>manager_key_xyz789</code><br>
    🔑 <code>admin_key_root</code>
  </div>
</div>

<script>
// =====================================================================
//  Ключи и редиректы (дублируют config/roles.yaml для статики)
// =====================================================================
const KEYS = {
  "doctor_key_abc123": {
    role: "doctor",
    name: "Туаева А.С.",
    redirect: "doctor_1030.html"       // первый пациент врача
  },
  "manager_key_xyz789": {
    role: "manager",
    name: "Главврач",
    redirect: "manager.html"           // дашборд
  },
  "admin_key_root": {
    role: "admin",
    name: "Администратор",
    redirect: "manager.html"           // админ видит всё → начнём с дашборда
  }
};

// =====================================================================
//  Логин
// =====================================================================
function login(event) {
  event.preventDefault();
  const key = document.getElementById("key").value.trim();
  const alert = document.getElementById("alert");
  alert.className = "alert";

  const entry = KEYS[key];
  if (!entry) {
    alert.className = "alert error";
    alert.textContent = "Неверный API-ключ";
    return false;
  }

  // Сохраняем сессию
  localStorage.setItem("artknit_role", entry.role);
  localStorage.setItem("artknit_name", entry.name);

  // Редирект
  window.location.href = entry.redirect;
  return false;
}

// Автоподстановка ключа из URL: login.html?key=doctor_key_abc123
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const k = params.get("key");
  if (k) document.getElementById("key").value = k;
});
</script>
</body>
</html>
