# config/unknown_markers.yaml
# Маркеры, которые указывают: «в протоколе что-то есть».
# Если такой маркер есть, а известный триггер не сработал — отдаём врачу.

markers:
  # Прямое указание на находку
  - "выявлен"
  - "выявлена"
  - "выявлено"
  - "выявлены"
  - "обнаружен"
  - "обнаружена"
  - "обнаружено"
  - "обнаружены"
  - "определяется"
  - "определяются"
  - "определён"
  - "определена"
  - "определено"

  # Визуализация
  - "визуализируется"
  - "визуализируются"
  - "лоцируется"
  - "лоцируются"
  - "прослеживается"
  - "прослеживаются"
  - "прослежен"

  # Наличие
  - "имеется"
  - "имеются"
  - "наличие"
  - "признаки"
  - "признак"

  # Оценка
  - "расценивается"
  - "расцениваются"
  - "соответствует"
  - "соответствуют"

  # Образования/узлы (обобщённые слова, которые сами по себе не диагноз)
  - "образование"
  - "образования"
  - "узел"
  - "узлы"
  - "уплотнение"
  - "изменение"
  - "изменения"
  - "включения"
  - "включение"

# Слова, наличие которых в предложении с маркером отменяет "неопознанность"
# (типа "не выявлено", "не обнаружено" — это НЕ находка)
suppress_if_negated: true
