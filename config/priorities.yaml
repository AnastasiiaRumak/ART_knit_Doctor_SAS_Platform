# Приоритеты маршрутов. Чем больше число — тем выше приоритет.
# Если найдено несколько триггеров, выбирается с максимальным приоритетом.

priorities:
  emergency: 100        # Окклюзия, тромбоз, мастит — срочно
  oncological: 80       # BI-RADS 4/5, O-RADS 3-5, лимфоузлы
  urgent: 60            # TI-RADS 3, стеноз > 50%, остаточная моча > 100 мл
  planned: 40           # Полип, миома, киста
  observation: 20       # Кальцинаты, фиброз, диффузные изменения
  negative: 0           # Норма — не направлять

# Срочность → сроки (в днях)
urgency_deadlines:
  emergency: 1          # Связаться в течение 24 часов
  oncological: 3        # Запись в течение 3 дней
  urgent: 7             # Запись в течение 7 дней
  planned: 14           # Запись в течение 14 дней
  observation: 30       # Наблюдение в течение 30 дней

# Срочность → сценарий коммуникации
urgency_scenarios:
  emergency: "срочный_контакт"      # Звонок координатора, не SMS
  oncological: "мягкий_сценарий"    # Врач-координатор связывается
  urgent: "стандартный"             # Push/SMS + запись онлайн
  planned: "стандартный"            # Push/SMS + запись онлайн
  observation: "мягкий"             # Просто рекомендация в ЛК

# Специальности, которые считаются "онконастороженными"
oncological_specialists:
  - "Онколог"
  - "Маммолог"
  - "Эндокринолог"

# Специальности, которые считаются "срочными"
emergency_specialists:
  - "Сосудистый хирург"
  - "Хирург"